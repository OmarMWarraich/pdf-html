[project]
name = "pdf-html"
version = "0.1.0"
description = "Convert any text-based PDF into beautiful, self-contained HTML — verbatim text, source typographic style, no images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
]

[project.scripts]
pdf2html = "pdf_html.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
