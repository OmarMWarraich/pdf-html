[project]
name = "pdf-html"
version = "0.1.1"
description = "Early-stage geometry-first PDF-to-HTML converter for text-based PDFs — verbatim text, source typography, zero images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omar Warraich" }]
keywords = ["pdf", "html", "converter", "pdf-to-html", "document-conversion", "pymupdf", "semantic-html", "text-based-pdf", "geometry-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/OmarMWarraich/pdf-html"
Repository = "https://github.com/OmarMWarraich/pdf-html"
Issues = "https://github.com/OmarMWarraich/pdf-html/issues"
Documentation = "https://github.com/OmarMWarraich/pdf-html#readme"

[project.scripts]
pdf-html = "pdf_html.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
